name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
      - run: ruff check medaugmentx tests examples benchmarks notebooks
      - run: ruff format --check medaugmentx tests examples benchmarks notebooks
      - run: mypy medaugmentx
  test:
    name: Python ${{ matrix.python }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        python: ['3.9', '3.10', '3.11', '3.12', '3.13', '3.14']
        os: [ubuntu-latest]
        include:
          - {python: '3.12', os: windows-latest}
          - {python: '3.12', os: macos-latest}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e '.[test,viz]'
      - run: python -m pytest --cov=medaugmentx --cov-branch --cov-report=xml --cov-fail-under=85
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.python }}-${{ matrix.os }}
          path: coverage.xml
  minimum:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.9'
      - run: python -m pip install 'numpy==1.22.4' 'scipy==1.9.3' 'pydicom==2.3.1' 'nibabel==4.0.2' 'pytest>=7,<8' pytest-cov hypothesis pyyaml
      - run: python -m pip install -e . --no-deps
      - run: python -m pytest
  frameworks:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        dependencies: [current, minimum]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - if: matrix.dependencies == 'current'
        run: python -m pip install -e '.[frameworks,test]'
      - if: matrix.dependencies == 'minimum'
        run: |
          python -m pip install 'numpy<2' 'torch==2.0.1' 'monai==1.3.0' 'torchio==0.19.0'
          python -m pip install -e '.[test]'
      - run: python -m pytest tests/interop
  package:
    runs-on: ubuntu-latest
    env:
      MEDAUGMENTX_DOCS_OFFLINE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[test,viz,docs,notebooks]' build twine
      - run: python -m build
      - run: python -m twine check dist/*
      - name: Test installed wheel outside checkout
        run: |
          python -m venv /tmp/medaugmentx-wheel
          wheel=$(ls dist/*.whl)
          /tmp/medaugmentx-wheel/bin/python -m pip install "${wheel}[test,viz]"
          mkdir -p /tmp/medaugmentx-wheel-check
          cp -R tests /tmp/medaugmentx-wheel-check/tests
          cp pyproject.toml /tmp/medaugmentx-wheel-check/pyproject.toml
          cd /tmp/medaugmentx-wheel-check
          /tmp/medaugmentx-wheel/bin/python -m pytest tests
      - run: python -m sphinx -W --keep-going -b html -c docs/sphinx . /tmp/medaugmentx-docs
      - run: python examples/quickstart.py
      - run: python examples/reproducible_experiment.py
      - run: python examples/preview_and_replay.py --output /tmp/medaugmentx-preview
      - run: python benchmarks/benchmark.py --shape 8 16 16 --repeats 2 --json /tmp/benchmark.json
      - run: python notebooks/run_notebooks.py
      - uses: actions/upload-artifact@v4
        with:
          name: distributions-and-docs
          path: |
            dist/
            /tmp/medaugmentx-docs/
