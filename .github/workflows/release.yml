name: Release
# Publishing requires an explicitly published GitHub release and the configured
# PyPI trusted publisher plus a protected 'pypi' environment. Main pushes do not publish.
on:
  release:
    types: [published]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[test,viz,docs]' build twine
      - name: Verify release tag equals package version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: python -c "import os, medaugmentx; assert os.environ['RELEASE_TAG'] == 'v' + medaugmentx.__version__"
      - run: python -m pytest
      - run: python -m build
      - run: python -m twine check dist/*
      - run: python -m sphinx -W --keep-going -b html -c docs/sphinx . /tmp/docs
        env:
          MEDAUGMENTX_DOCS_OFFLINE: '1'
      - uses: actions/upload-artifact@v4
        with:
          name: distributions
          path: dist/
  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: distributions
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
