name: Release
# Publishing requires an explicitly published GitHub release and the configured
# PyPI trusted publisher plus a protected 'pypi' environment. Main pushes do not publish.
on:
  release:
    types: [published]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}
      - name: Require successful CI for the release commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          release_sha=$(git rev-parse HEAD)
          conclusion=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml --event push --commit "$release_sha" --limit 1 --json status,conclusion --jq '.[0] | select(.status == "completed") | .conclusion')
          if [ "$conclusion" != "success" ]; then
            echo "Release requires a successful complete CI run for $release_sha"
            exit 1
          fi
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[test,viz,docs]' build twine
      - name: Verify release tag equals package version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: python -c "import os, medaugmentx; assert os.environ['RELEASE_TAG'] == 'v' + medaugmentx.__version__"
      - run: python -m pytest
      - run: python -m build
      - run: python -m twine check dist/*
      - run: python -m sphinx -W --keep-going -b html -c docs/sphinx . /tmp/docs
        env:
          MEDAUGMENTX_DOCS_OFFLINE: '1'
      - uses: actions/upload-artifact@v4
        with:
          name: distributions
          path: dist/
  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: distributions
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
